name: Node CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  release:
    name: Build, test, and release
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Check whether a release is needed
        id: release_preflight
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = require('./.releaserc.json');
          // A dry run should analyze commits without verifying npm credentials.
          const plugins = config.plugins.map(plugin =>
            plugin === '@semantic-release/npm' ? [plugin, { npmPublish: false }] : plugin
          );
          require('semantic-release')({ dryRun: true, ci: false, plugins })
            .then(result => fs.appendFileSync(process.env.GITHUB_OUTPUT, `required=${Boolean(result)}\n`))
            .catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.release_preflight.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
